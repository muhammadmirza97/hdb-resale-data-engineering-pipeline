version: "3.8"

# ── How to use ────────────────────────────────────────────────────────────────
#
#  Full stack (pipeline + API + dashboard):
#    docker-compose up --build
#
#  Pipeline only:
#    docker-compose up --build hdb-pipeline
#
#  API + dashboard (assumes pipeline has run and warehouse/ exists):
#    docker-compose up --build hdb-api hdb-dashboard
#
#  Single step:
#    docker-compose run --rm hdb-pipeline python -m src.ingest
#
#  With optional Kafka:
#    docker-compose --profile kafka up --build
#
#  All outputs are written to your local machine via volume mounts:
#    data/  warehouse/  reports/  logs/  models/  mlruns/
#
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── ELT + ML Pipeline ──────────────────────────────────────────────────────
  hdb-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hdb_resale_pipeline
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./warehouse:/app/warehouse
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    command: python -m src.run_pipeline

  # ── FastAPI Prediction Service ─────────────────────────────────────────────
  hdb-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hdb_resale_api
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./warehouse:/app/warehouse
      - ./models:/app/models
    ports:
      - "8011:8011"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8011
    depends_on:
      - hdb-pipeline

  # ── Streamlit Dashboard ────────────────────────────────────────────────────
  hdb-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hdb_resale_dashboard
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./warehouse:/app/warehouse
      - ./reports:/app/reports
      - ./models:/app/models
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - hdb-pipeline

  # ── Optional: Kafka (streaming simulation) ─────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hdb_zookeeper
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hdb_kafka
    profiles: ["kafka"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
